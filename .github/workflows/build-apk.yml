name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar keystore (si hay Secrets configurados)
        id: ks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar APK release firmado
        if: steps.ks.outputs.signed == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Compilar APK debug (sin Secrets)
        if: steps.ks.outputs.signed != 'true'
        run: gradle assembleDebug

      - name: Reunir APK
        run: |
          mkdir -p dist
          if [ "${{ steps.ks.outputs.signed }}" = "true" ]; then
            cp app/build/outputs/apk/release/*.apk dist/VisorWeb.apk
          else
            cp app/build/outputs/apk/debug/*.apk dist/VisorWeb-debug.apk
          fi
          ls -la dist

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: VisorWeb-apk
          path: dist/*.apk

      - name: Crear Release (solo al subir un tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
